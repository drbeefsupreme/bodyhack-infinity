<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Posing tutor debug</title>
<style>
  :root { color-scheme: dark; font: 13px/1.35 system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #15171c; color: #e4e4e4; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 470px; }
  #stage { position: relative; display: grid; place-items: center; min-height: 0; background: #0b0c0f; }
  #view { max-width: 100%; max-height: 100vh; }
  #stage.dragging { outline: 3px dashed #5fb37a; outline-offset: -12px; }
  #hint { position: absolute; margin: 0; color: #9aa; }
  aside { overflow-y: auto; padding: 8px 12px 24px; border-left: 1px solid #2c2f36; }
  h2 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #8fa1b3; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  button, select { font: inherit; background: #262a31; color: inherit; border: 1px solid #3a3f48; border-radius: 4px; padding: 3px 8px; }
  #status, #error { margin: 6px 0; color: #9aa; }
  #error { color: #ff8a80; }
  #phase { font-size: 18px; font-weight: 600; }
  #phase[data-phase='holding'] { color: #ffd54f; }
  #phase[data-phase='hit'] { color: #69f0ae; }
  #score { font-size: 28px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 1px 4px; border-bottom: 1px solid #23262c; }
  td:not(:first-child) { text-align: right; }
  tr.miss td { color: #ffab91; }
  ol { margin: 0; padding-left: 20px; }
  #events { padding-left: 0; list-style: none; font-variant-numeric: tabular-nums; }
  #events li span { color: #8fa1b3; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="view" width="1280" height="720"></canvas>
    <p id="hint">Press Camera, or drop an image or video file here.</p>
  </main>
  <aside>
    <div class="row">
      <button id="camera">Camera</button>
      <button id="open">Open file</button>
      <input id="file" type="file" accept="image/*,video/*" hidden />
      <select id="pose" aria-label="Pose"></select>
      <button id="restart">Restart</button>
      <button id="calibrate">Calibrate</button>
    </div>
    <div class="row">
      <label><input id="mute" type="checkbox" /> Mute</label>
      <select id="voice" aria-label="Voice"></select>
      <span id="speaking"></span>
    </div>
    <div id="status">Tracker not loaded.</div>
    <div id="error"></div>
    <h2>Session</h2>
    <div id="phase"></div>
    <div id="session"></div>
    <h2>Score</h2>
    <div id="score">-</div>
    <div id="scoreInfo"></div>
    <ol id="faults"></ol>
    <h2>Events and spoken cues</h2>
    <ol id="events"></ol>
    <h2>Checks</h2>
    <table id="checks"></table>
    <h2>Metrics</h2>
    <table id="metrics"></table>
  </aside>
  <video id="video" playsinline muted hidden></video>
  <script type="module" src="/src/posing/debug.ts"></script>
</body>
</html>
